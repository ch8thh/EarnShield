<style>
/* Plan: black primary, white secondary text, green = money in, red = money out.
   One font family across English, Hindi and Kannada, bold throughout.
   Layout: one phone frame, four screens (language, home, money and vault, test lab). */
:root{
  --ink:#0A0A0A;
  --paper:#FFFFFF;
  --bg:#F2F2EF;
  --line:#E2E2DC;
  --soft:#ECECE6;
  --mute:#55554F;
  --pos:#087F37;
  --pos-d:#3EDC84;
  --neg:#D02A1E;
  --neg-d:#FF7A6E;
  --font:'Noto Sans','Noto Sans Devanagari','Noto Sans Kannada',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#E7E7E2;color:var(--ink);font-family:var(--font);font-weight:700;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
html[lang="hi"] body,html[lang="kn"] body{line-height:1.65}
button{font:inherit;font-weight:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:3px solid #2B6CFF;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.pos-d{color:var(--pos-d)}.neg-d{color:var(--neg-d)}

/* page layout */
.shell{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:32px 24px}
.rail{width:250px;display:flex;flex-direction:column;gap:8px}
.rail h2{font-size:15px;color:var(--mute);margin-bottom:6px;letter-spacing:.02em}
.rail button{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;border-radius:16px;border:2px solid transparent;font-size:17px}
.rail button:hover{background:rgba(10,10,10,.06)}
.rail button[aria-current="true"]{background:var(--ink);color:#fff}
.rail .n{width:30px;height:30px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:14px;flex:none}
.brand-rail{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800;margin-bottom:18px}

.phone{position:relative;width:390px;height:min(844px,calc(100dvh - 64px));min-height:640px;background:var(--bg);border-radius:44px;box-shadow:0 0 0 10px var(--ink),0 40px 80px rgba(0,0,0,.22);overflow:hidden;display:flex;flex-direction:column}
@media (max-width:900px){.rail{display:none}}
@media (max-width:520px){
  .shell{padding:0}
  .phone{width:100%;height:100dvh;min-height:0;border-radius:0;box-shadow:none}
}

.view{flex:1;min-height:0;overflow-y:auto;padding:22px 20px 28px;display:flex;flex-direction:column;gap:16px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.head .ttl{display:flex;align-items:center;gap:10px;min-width:0}
.head h1{font-size:28px;line-height:1.3;font-weight:800;text-wrap:balance}
.date{font-size:15px;color:var(--mute)}
.lang{display:flex;flex:none;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:2px}
.lang button{min-width:44px;height:40px;padding:0 6px;border-radius:999px;font-size:15px;font-weight:800;text-align:center}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.card h2{font-size:20px;line-height:1.35;font-weight:800}
.cap{font-size:15px;color:var(--mute);line-height:1.5}
.hero{background:var(--ink);color:#fff;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:14px}
.hero .lbl{font-size:17px}
.amt{font-size:60px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.hero p{font-size:17px}
.hero hr{border:0;border-top:1px solid rgba(255,255,255,.22)}
.hero-row{display:flex;gap:12px}
.hero-row>div{flex:1;display:flex;flex-direction:column}
.hero-row span{font-size:15px}
.hero-row b{font-size:24px;font-weight:800}
.status{display:flex;align-items:flex-start;gap:10px;font-size:16px}
.status svg{flex:none;margin-top:4px}

/* buttons */
.btn{min-height:58px;border-radius:18px;background:var(--ink);color:#fff;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 18px;text-align:center;line-height:1.35}
.btn.light{background:var(--paper);color:var(--ink);border:2px solid var(--ink)}
.btn.on-dark{background:#fff;color:var(--ink)}
.btn.danger{background:#c9261b;color:#fff}
.btn.earn{background:var(--pos);color:#fff}.btn.spend{background:var(--neg);color:#fff}
.btn[disabled]{opacity:.3;cursor:not-allowed}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two .btn{flex-direction:column;gap:6px;padding:14px 8px;min-height:92px}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none}
.dot.p{background:var(--pos-d)}.dot.n{background:var(--neg-d)}
.icon-btn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--soft)}

/* rows and pills */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.row+.row{border-top:1px solid var(--line)}
.row .big{font-size:22px;font-weight:800}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:14px;font-weight:800;line-height:1.5;align-self:flex-start}
.pill.ok{background:#DFF4E7;color:var(--pos)}
.pill.bad{background:#FCE6E3;color:var(--neg)}
.pill.na{background:var(--soft);color:var(--mute)}
.goal{display:flex;flex-direction:column;gap:6px;padding:12px 0}
.goal+.goal{border-top:1px solid var(--line)}
.bar{height:14px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.on-black .bar{background:rgba(255,255,255,.22)}
.on-black .bar i{background:#fff}
.link-card{text-align:left;width:100%}
.split{display:flex;height:18px;border-radius:99px;overflow:hidden;gap:3px}
.split i{display:block;height:100%;min-width:0}
.sw1{background:var(--ink)}.sw2{background:#8A8A83}.sw3{background:#CFCFC8}
.key{width:16px;height:16px;border-radius:5px;flex:none}
.keyrow{display:flex;align-items:center;gap:10px}

.note{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:14px 16px;font-size:15px;line-height:1.55}
.note svg{flex:none;margin-top:3px}
.acc{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;font-size:17px;font-weight:800}
.acc svg{transition:transform .15s}
.acc[aria-expanded="true"] svg{transform:rotate(180deg)}
.bullets{display:flex;flex-direction:column;gap:10px;font-size:16px}
.bullets div{display:flex;gap:10px}
.bullets div:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink);margin-top:11px;flex:none}

/* tabs */
.tabs{flex:none;background:var(--ink);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 10px calc(10px + env(safe-area-inset-bottom));gap:6px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px;padding:6px 4px;border-radius:18px;color:#B5B5AE;font-size:14px;font-weight:800;text-align:center;line-height:1.35}
.tabs button[aria-current="true"]{background:#fff;color:var(--ink)}

/* language screen */
.lang-screen{justify-content:space-between;gap:16px;padding-top:32px}
.logo{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:800}
.logo .mark{width:48px;height:48px;border-radius:14px;background:var(--ink);color:#fff;display:grid;place-items:center}
.lang-screen h1{font-size:32px;line-height:1.3;font-weight:800;text-wrap:balance}
.tile{display:flex;align-items:center;gap:16px;min-height:76px;padding:12px 18px;background:var(--paper);border:3px solid var(--line);border-radius:24px;width:100%}
.tile[aria-pressed="true"]{border-color:var(--ink)}
.tile .g{width:48px;height:48px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:24px;font-weight:800;flex:none}
.tile[aria-pressed="true"] .g{background:var(--ink);color:#fff}
.tile .nm{font-size:26px;font-weight:800;flex:1;line-height:1.4}
.tile .ck{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.tile[aria-pressed="true"] .ck{background:var(--ink);border-color:var(--ink);color:#fff}

/* sheets */
.scrim{position:absolute;inset:0;background:rgba(10,10,10,.55);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;max-height:94%;overflow-y:auto;background:var(--paper);border-radius:30px 30px 0 0;padding:20px 20px 28px;display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-head h2{font-size:22px;font-weight:800;line-height:1.4}
.lab{font-size:16px;color:var(--mute)}
.amount{display:flex;align-items:center;gap:6px;height:76px;border:3px solid var(--ink);border-radius:20px;padding:0 18px;font-size:38px;font-weight:800}
.amount:focus-within{outline:3px solid #2B6CFF;outline-offset:2px}
.amount input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;color:inherit;height:100%}
#dyn{display:flex;flex-direction:column;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:50px;padding:6px 16px;border-radius:16px;border:2px solid var(--line);background:var(--paper);font-size:16px;font-weight:800;line-height:1.4}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp>div{background:var(--bg);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:2px}
.cmp b{font-size:26px;font-weight:800;line-height:1.3}
.say{font-size:16px;display:flex;gap:10px;align-items:flex-start}
.say svg{flex:none;margin-top:3px}

/* switches */
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:68px;padding:12px 16px;border-radius:20px;background:var(--paper);border:2px solid var(--line);width:100%;font-size:17px;line-height:1.45}
.sw[aria-checked="true"]{border-color:var(--ink)}
.trk{width:58px;height:34px;border-radius:99px;background:#C9C9C2;position:relative;flex:none;transition:background .15s}
.trk:after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"] .trk{background:var(--ink)}
.sw[aria-checked="true"] .trk:after{transform:translateX(24px)}

/* results */
.res-head,.res-cells{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res-head div{font-size:15px;line-height:1.4;text-align:center;padding:6px 4px;border-radius:12px;background:var(--soft)}
.res-head div.es{background:var(--ink);color:#fff}
.metric{display:flex;flex-direction:column;gap:8px;padding:12px 0}
.metric+.metric{border-top:1px solid var(--line)}
.metric>span{font-size:16px;line-height:1.5}
.res-cells>div{border:2px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70px;line-height:1.35}
.res-cells b{font-size:21px;font-weight:800}
.res-cells small{font-size:13px;font-weight:800;display:flex;align-items:center;gap:4px}
.warnbox{border-radius:24px;padding:20px;background:var(--ink);color:#fff;display:flex;flex-direction:column;gap:10px}
.warnbox h2{font-size:20px;font-weight:800}
.warnbox .st{display:flex;gap:10px;font-size:16px}
.warnbox .st svg{flex:none;margin-top:4px}

/* weather alert */
.alert{background:var(--neg);color:#fff;border-radius:22px;padding:18px;display:flex;gap:14px;align-items:flex-start;font-size:16px;line-height:1.55}
.alert svg{flex:none;margin-top:2px}
.alert .tag{font-size:14px;opacity:.9;margin-top:4px}
/* stress lab game */
.progress{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stars{display:flex;gap:4px;color:#B9B9B2}
.stars .on{color:var(--pos)}
.stars svg{fill:none}.stars .on svg{fill:currentColor}
.pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{position:relative;min-height:116px;padding:14px 12px;border:3px solid var(--line);border-radius:22px;background:var(--paper);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;font-size:16px;line-height:1.4}
.pick[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.pick .pi{width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--ink);display:grid;place-items:center}
.pick[aria-pressed="true"] .pi{background:#fff}
.pick .dn{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--pos-d);color:var(--ink);display:grid;place-items:center}
.pick[disabled]{opacity:.5;cursor:not-allowed}
.segs{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.segs i{display:block;height:16px;border-radius:5px;background:rgba(255,255,255,.22)}
.segs i.on{background:var(--pos-d)}
.badge{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;flex:none}
.badge.good{background:var(--pos-d);color:var(--ink)}
.badge.meh{background:var(--soft);color:var(--ink)}
.verdict{font-size:24px;line-height:1.4;font-weight:800;text-wrap:balance}
.barrow{display:flex;flex-direction:column;gap:6px}
.barrow .bl{display:flex;justify-content:space-between;gap:10px;font-size:16px}
.track{height:22px;border-radius:99px;background:var(--soft);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px}
.big-pill{font-size:20px;padding:8px 16px;align-self:flex-start}
.pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 2.3s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),980px) rotate(720deg)}}

/* brand logo */
.mk{display:block;flex:none}
.brand-card{padding:4px 0 0;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink);text-align:center}
.brand-card img{width:172px;height:auto;display:block}
.brand-card p{font-size:16px;line-height:1.5}

.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-size:16px;z-index:30;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  <aside class="rail" id="rail" aria-label="Screens"></aside>
  <main class="phone" id="phone"></main>
</div>

/* ---------- money logic ---------- */
function daysUntil(day){
 const now=new Date(),y=now.getFullYear(),m=now.getMonth(),today=new Date(y,m,now.getDate());
 const dim=(yy,mm)=>new Date(yy,mm+1,0).getDate();
 let d=new Date(y,m,Math.min(day,dim(y,m)));
 if(d<today)d=new Date(y,m+1,Math.min(day,dim(y,m+1)));
 return Math.round((d-today)/864e5);
}
const billsTotal=()=>S.bills.reduce((a,b)=>a+b.amt,0);
function calc(){
 const sum=k=>S.entries.filter(e=>e.kind===k).reduce((a,e)=>a+e.amt,0);
 const gross=sum('fare'),work=sum('work'),house=sum('house'),withdrawn=sum('emergency');
 const net=gross-work;
 let bills=0,vaultA=0,spendA=0;
 const billsDay=Math.round(billsTotal()*BILLS_SHARE/10)*10;
 if(net>0){bills=Math.min(net,billsDay);const rem=net-bills;
  vaultA=Math.min(rem,Math.round((250+Math.max(0,net-1550)*0.4)/10)*10);spendA=rem-vaultA;}
 const spendLeft=Math.max(0,spendA-house);
 const vault=VAULT_BASE-withdrawn;
 const runway=Math.floor(vault/NEED_DAY);
 const days=HIST.days+(gross>0?1:0);
 const avg=(HIST.gross-HIST.work+Math.max(net,0))/days;
  const r={billsDay,gross,work,house,withdrawn,net,bills,vaultA,spendA,spendLeft,vault,runway,days,avg,shortfall:shortfallFor(vault)};
 if(!S.api)return r;
 const d=S.api.d;
 return {...r,bills:d.today.bills,vaultA:d.today.reserve,spendA:d.safeToSpend,spendLeft:Math.max(0,d.safeToSpend-house),vault:d.reserve.balance,runway:d.runwayDays,shortfall:d.check14.shortfall,avg:d.variability.avg,days:Math.min(14,d.daysOfData)};
}
function shortfallFor(vault){
 const need=S.bills.filter(b=>daysUntil(b.day)<=14).reduce((a,b)=>a+b.amt,0)+14*NEED_DAY,have=BILLS_FUND+vault+14*LEAN_INCOME_DAY;
 return Math.max(0,need-have);
}

/* ---------- stress-test engine (same seeded events for both plans) ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
const SIM={N:1000,D:365,E:NEED_DAY,START:16000,WORK:0.85,MEAN:1500,SHOCKS:3,SH_LO:2000,SH_HI:8000};
function simulate(seed,opt,bills){
 bills=bills||S.bills;
 const {N,D,E,START}=SIM,r=mulberry32(seed);
 const gauss=()=>{const u=1-r(),v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
 const due=new Array(D).fill(0);
 for(let m=0;m<12;m++){const base=Math.round(m*30.4);bills.forEach(b=>{const d=Math.min(D-1,base+Math.max(1,b.day)-1);due[d]+=b.amt})}
 const pre=[0];for(let d=0;d<D;d++)pre.push(pre[d]+due[d]);
 const within=(d,n)=>pre[Math.min(D,d+n)]-pre[d];
 const A={m:0,s:0,b:0,e:0},B={m:0,s:0,b:0,e:0};
 for(let y=0;y<N;y++){
  const net=new Array(D),shock=new Array(D).fill(0),mk=[];
  for(let m=0;m<13;m++)mk.push(Math.min(1.25,Math.max(0.65,1+0.18*gauss())));
  for(let d=0;d<D;d++){net[d]=r()<SIM.WORK?Math.max(250,SIM.MEAN*mk[Math.floor(d/30.4)]*Math.exp(0.32*gauss()-0.05)):0}
  for(let k=0;k<SIM.SHOCKS;k++){shock[Math.floor(r()*D)]+=SIM.SH_LO+Math.round(r()*(SIM.SH_HI-SIM.SH_LO))}
  const need=E*D+within(0,D)+shock.reduce((a,b)=>a+b,0),tot=net.reduce((a,b)=>a+b,0);
  if(tot<need*1.03){const f=need*1.03/tot;for(let d=0;d<D;d++)net[d]*=f}
  if(opt.vehicle){const s=Math.floor(r()*(D-10));for(let d=s;d<s+10;d++)net[d]=0}
  if(opt.lean){const s=Math.floor(r()*(D-60));for(let d=s;d<s+60;d++)net[d]*=0.55}
  for(const plan of ['base','es']){
   let cash=START,missed=0,short=0,borrow=0;
   for(let d=0;d<D;d++){
    cash+=net[d];
    const pay=(a,bill)=>{if(cash>=a)cash-=a;else{borrow+=a-cash;cash=0;if(bill)missed++}};
    if(due[d])pay(due[d],true);
    if(shock[d])pay(shock[d],false);
    let spend;
    if(plan==='base')spend=Math.max(E,0.5*net[d]);
    else spend=E+Math.min(150,Math.max(0,(cash-(within(d,30)+15*E))*0.1));
    const paid=Math.min(cash,spend);
    if(paid<E){short++;borrow+=E-paid}
    cash-=paid;
   }
   const T=plan==='base'?A:B;if(missed>0)T.m++;T.s+=short;T.b+=borrow;T.e+=cash/E;
  }
 }
 const f=T=>({missed:T.m,short:T.s/N,borrow:T.b/N,end:T.e/N});
 return {base:f(A),es:f(B)};
}

function confetti(){
 if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const ph=$('#phone');if(!ph||S.screen!==3)return;
 const cols=['#3EDC84','#087F37','#0A0A0A','#8A8A83','#3EDC84'];
 const el=document.createElement('div');el.className='confetti';el.setAttribute('aria-hidden','true');
 for(let i=0;i<46;i++){const c=document.createElement('i');c.style.left=(Math.random()*100)+'%';c.style.background=cols[i%cols.length];c.style.setProperty('--dx',((Math.random()-.5)*160)+'px');c.style.animationDelay=(Math.random()*.5)+'s';c.style.animationDuration=(1.8+Math.random()*1.2)+'s';el.appendChild(c)}
 ph.appendChild(el);setTimeout(()=>el.remove(),3600);

function runTest(){
 const L=S.lab;if(L.phase==='run')return;
 if(!L.res[L.pick])L.res[L.pick]=simulate(SEED,SCEN[L.pick]);
 L.phase='run';L.month=0;L.fresh=false;L.details=false;render();
 {const el=$('#labrun');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}
 const key=L.pick;let m=0;
 const id=setInterval(()=>{m++;L.month=m;paintRun();if(m>=12){clearInterval(id);setTimeout(()=>finishTest(key),380)}},210);
}
function finishTest(key){
 const L=S.lab,before=ORDER.every(k=>L.done[k]);
 L.done[key]=true;L.phase='idle';L.pick=key;
 const all=ORDER.every(k=>L.done[k]);L.newBadge=all&&!before;
 const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(S.screen!==3||reduce){L.fresh=false;L.p=1;render();return}
 L.fresh=true;L.p=0;render();
 {const el=$('#labres');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
 const t0=performance.now(),dur=1000;
 const step=now=>{const x=Math.max(0,Math.min(1,(now-t0)/dur));L.p=1-Math.pow(1-x,3);paintResult();
  if(x<1)requestAnimationFrame(step);else{L.fresh=false;L.p=1}};
 requestAnimationFrame(step);
 const r=L.res[key];if(safe100(r.es)-safe100(r.base)>=10||L.newBadge)setTimeout(confetti,450);
}

   <label class="lab" for="amt">${t('amount')}</label>
   <div class="amount"><span>₹</span><input id="amt" inputmode="numeric" autocomplete="off" value="${sh.amount}" aria-describedby="dyn"></div>
   <div class="chips">${q.map(v=>`<button class="chip" data-a="quick" data-v="${v}" aria-pressed="false">${fmt(v)}</button>`).join('')}</div>
   ${isIn?'':`<div class="lab">${t('for_what')}</div><div class="chips">${catsExp.map(k=>`<button class="chip" data-a="cat" data-v="${k}" aria-pressed="${sh.cat===k}">${t(k)}</button>`).join('')}</div>`}
   <button class="btn light" data-a="voice">${ic('mic',22)}${t('speak')}</button>
   <div id="dyn">${dynAdd()}</div>`;
 }else if(sh.type==='out'){
  const rs=['r_puncture','r_breakdown','r_medical','r_other'];
  body=`<div class="sheet-head"><h2 id="st">${t('out_title')}</h2>${close}</div>
   <label class="lab" for="amt">${t('out_amt')}</label>
   <div class="amount"><span>₹</span><input id="amt" inputmode="numeric" autocomplete="off" value="${sh.amount}" aria-describedby="dyn"></div>
   <div class="chips">${[500,1000,2000].map(v=>`<button class="chip" data-a="quick" data-v="${v}" aria-pressed="false">${fmt(v)}</button>`).join('')}</div>
   <div class="lab">${t('out_why')}</div>
   <div class="chips">${rs.map(k=>`<button class="chip" data-a="reason" data-v="${k}" aria-pressed="${sh.reason===k}">${t(k)}</button>`).join('')}</div>
   <div id="dyn">${dynOut()}</div>`;
 }else if(sh.type==='bill'){
  body=`<div class="sheet-head"><h2 id="st">${sh.id?t('bill_edit'):t('bill_add')}</h2>${close}</div>
   <div class="lab">${t('bill_what')}</div>
   <div class="chips">${BILL_KINDS.map(k=>`<button class="chip" data-a="billKind" data-v="${k}" aria-pressed="${sh.kind===k}">${t(k)}</button>`).join('')}</div>
   <label class="lab" for="amt">${t('amount')}</label>
   <div class="amount"><span>₹</span><input id="amt" inputmode="numeric" autocomplete="off" value="${sh.amount}"></div>
   <label class="lab" for="day">${t('bill_day')}</label>
   <div class="amount" style="height:64px;font-size:30px"><input id="day" inputmode="numeric" autocomplete="off" maxlength="2" value="${sh.day}"></div>
   <div class="chips">${[1,5,10,15,20,25].map(v=>`<button class="chip" data-a="billDay" data-v="${v}" aria-pressed="${String(v)===sh.day}">${v}</button>`).join('')}</div>
   <div id="dyn">${dynBill()}</div>`;
 }else if(sh.type==='reset'){
  body=`<div class="sheet-head"><h2 id="st">${t('reset_q')}</h2>${close}</div>
   <div class="note">${ic('alert',22)}<span>${t('reset_warn')}</span></div>
   <button class="btn danger" data-a="confirmReset">${t('reset_yes')}</button>
   <button class="btn light" data-a="close">${t('reset_no')}</button>`;
 }else{
  body=`<div class="sheet-head"><h2 id="st">${t('export_title')}</h2>${close}</div>
   <div class="pill na">${t('x_period')}</div>
   <div><div class="row"><span>${t('x_gross')}</span><b class="num pos" style="font-size:20px;font-weight:800">${plus(exportData().gross)}</b></div>
   <div class="row"><span>${t('x_work')}</span><b class="num neg" style="font-size:20px;font-weight:800">${minus(exportData().work)}</b></div>
   <div class="row"><span>${t('x_net')}</span><b class="num" style="font-size:22px;font-weight:800">${fmt(exportData().net)}</b></div>
   <div class="row"><span>${t('x_days')}</span><b class="num" style="font-size:20px;font-weight:800">${exportData().days}</b></div></div>
   <div class="note">${ic('info',22)}<span>${t('x_note')}</span></div>
   <button class="btn" data-a="copy">${ic('copy',22)}${t('copy')}</button>`;
 }
 return `<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="st">${body}</div></div>`;
}
const num=v=>parseInt(v||'0',10)||0;
function dynBill(){const sh=S.sheet,a=num(sh.amount),d=num(sh.day);
 const dayBad=sh.day!==''&&(d<1||d>31),ok=a>0&&d>=1&&d<=31;
  return `${dayBad?`<div class="say neg">${ic('alert',22,3)}<span>${t('bill_day_bad')}</span></div>`:''}<button class="btn" data-a="saveBill" ${ok?'':'disabled'}>${t('bill_save')}${a>0?' · '+fmt(a):''}</button>${sh.id?`<button class="btn" data-a="payBill">${ic('check',22,3)}${t('bill_pay')}</button><button class="btn light" data-a="removeBill">${ic('trash',22)}${t('bill_remove')}</button>`:''}`}
function dynAdd(){const sh=S.sheet;const a=num(sh.amount);
 const vm={listening:'listening',na:'voice_na',retry:'voice_retry',perm:'voice_perm'};
 const msg=vm[sh.voice]?`<p class="cap">${t(vm[sh.voice])}</p>`:'';
 return `${msg}<button class="btn ${sh.kind==='fare'?'earn':'spend'}" data-a="saveAdd" ${a>0?'':'disabled'}>${t(sh.kind==='fare'?'add_earn':'add_exp')}${a>0?' · '+fmt(a):''}</button>`}
function dynOut(){const sh=S.sheet,c=calc(),a=num(sh.amount);
 if(a<=0)return `<button class="btn" disabled>${t('take_out')}</button>`;
 if(a>c.vault)return `<div class="say neg">${ic('alert',22,3)}<span>${t('out_bad')}</span></div><button class="btn" disabled>${t('out_confirm',{x:fmt(a)})}</button>`;
 const nv=c.vault-a,nr=Math.floor(nv/NEED_DAY),ns=shortfallFor(nv);
 return `<div class="lab">${t('change')}</div>
  <div class="cmp"><div><span class="cap">${t('before')}</span><b class="num">${t('days_unit',{n:c.runway})}</b></div><div><span class="cap">${t('after')}</span><b class="num ${nr<c.runway?'neg':''}">${t('days_unit',{n:nr})}</b></div></div>
  <div class="say ${ns>0?'neg':'pos'}">${ic(ns>0?'alert':'check',22,3)}<span>${ns>0?t('short14',{x:fmt(ns)}):t('ok14')}</span></div>
  <button class="btn" data-a="confirmOut">${t('out_confirm',{x:fmt(a)})}</button>`}
function exportData(){const c=calc();if(S.api&&S.api.r){const r=S.api.r;return {gross:r.gross,work:r.workCosts,net:r.net,days:r.daysWorked}}return {gross:HIST.gross+c.gross,work:HIST.work+c.work,net:HIST.gross+c.gross-HIST.work-c.work,days:c.days}}

/* ---------- shell render ---------- */
function render(){
 const prevScroll=$('.view')?$('.view').scrollTop:0,prevScreen=S._shown;
 document.documentElement.lang=S.lang;
 $('#rail').innerHTML=`<div class="brand-rail"><span class="logo" style="font-size:22px"><img class="mk" src="${LOGO_MARK}" width="48" height="48" alt="">EarnShield</span></div><h2>${t('rail_title')}</h2>`+
  [0,1,2,3].map(i=>`<button data-a="go" data-v="${i}" aria-current="${S.screen===i}"><span class="n">${i+1}</span>${t('s'+i)}</button>`).join('');
 const views=[viewLang,viewHome,viewMoney,viewLab];
 const tabs=S.screen>0?`<nav class="tabs" aria-label="Main">${[['tab_home','home',1],['tab_money','wallet',2],['tab_lab','flask',3]].map(x=>`<button data-a="go" data-v="${x[2]}" aria-current="${S.screen===x[2]}">${ic(x[1],24,2.6)}${t(x[0])}</button>`).join('')}</nav>`:'';
 $('#phone').innerHTML=views[S.screen]()+tabs+sheetHTML()+(S.toast?`<div class="toast" role="status">${S.toast}</div>`:'');
 if($('.view')&&prevScreen===S.screen)$('.view').scrollTop=prevScroll;
 S._shown=S.screen;
}
function refreshDyn(){const d=$('#dyn');if(!d||!S.sheet)return;d.innerHTML=S.sheet.type==='add'?dynAdd():S.sheet.type==='bill'?dynBill():dynOut()}
let toastTimer;
function toast(msg){S.toast=msg;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{S.toast='';const el=$('.toast');if(el)el.remove()},2200)}

/* ---------- actions ---------- */
function summaryText(){const x=exportData();
 return `EarnShield — ${t('export_title')}\n${t('x_period')}\n${t('x_gross')}: ${fmt(x.gross)}\n${t('x_work')}: ${fmt(x.work)}\n${t('x_net')}: ${fmt(x.net)}\n${t('x_days')}: ${x.days}\n${t('x_note')}`}
/* ---------- voice amount parser (digits in any script, number words in en/hi/kn) ---------- */
const NUM_WORDS={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90,
 'एक':1,'दो':2,'तीन':3,'चार':4,'पांच':5,'पाँच':5,'छह':6,'छः':6,'छे':6,'सात':7,'आठ':8,'नौ':9,'दस':10,'ग्यारह':11,'बारह':12,'तेरह':13,'चौदह':14,'पंद्रह':15,'पन्द्रह':15,'सोलह':16,'सत्रह':17,'अठारह':18,'उन्नीस':19,'बीस':20,'तीस':30,'चालीस':40,'पचास':50,'साठ':60,'सत्तर':70,'अस्सी':80,'नब्बे':90,'डेढ़':1.5,'डेढ':1.5,'ढाई':2.5,'ढ़ाई':2.5,
 'ಒಂದು':1,'ಎರಡು':2,'ಮೂರು':3,'ನಾಲ್ಕು':4,'ಐದು':5,'ಆರು':6,'ಏಳು':7,'ಎಂಟು':8,'ಒಂಬತ್ತು':9,'ಹತ್ತು':10,'ಇಪ್ಪತ್ತು':20,'ಮೂವತ್ತು':30,'ನಲವತ್ತು':40,'ಐವತ್ತು':50,'ಅರವತ್ತು':60,'ಎಪ್ಪತ್ತು':70,'ಎಂಬತ್ತು':80,'ತೊಂಬತ್ತು':90,
 'ಇನ್ನೂರು':200,'ಮುನ್ನೂರು':300,'ನಾನೂರು':400,'ಐನೂರು':500,'ಆರುನೂರು':600,'ಏಳುನೂರು':700,'ಎಂಟುನೂರು':800,'ಒಂಬೈನೂರು':900,'ಒಂಬೈನೂರ':900,'ಸಾವಿರದ':1000};
const NUM_MULT={hundred:100,'सौ':100,'ನೂರು':100,thousand:1000,k:1000,'हज़ार':1000,'हजार':1000,'ಸಾವಿರ':1000,lakh:1e5,lakhs:1e5,lac:1e5,'लाख':1e5,'ಲಕ್ಷ':1e5};
function parseAmount(text){
 let s=String(text||'').toLowerCase()
  .replace(/[०-९]/g,c=>c.charCodeAt(0)-0x966).replace(/[೦-೯]/g,c=>c.charCodeAt(0)-0xCE6)
  .replace(/(\d),(?=\d)/g,'$1').replace(/[-–—]/g,' ');
 const toks=s.match(/\d+(?:\.\d+)?|[^\s\d₹.,!?]+/g)||[];
 let total=0,cur=0,seen=false;
 for(const tk of toks){
  if(/^\d/.test(tk)){cur+=parseFloat(tk);seen=true}
  else if(tk in NUM_WORDS){cur+=NUM_WORDS[tk];seen=true}
  else if(tk in NUM_MULT){const m=NUM_MULT[tk];seen=true;if(m===100)cur=(cur||1)*100;else{total+=(cur||1)*m;cur=0}}
 }
 const v=Math.round(total+cur);
 return seen&&v>0?Math.min(v,999999):0;
}
function voice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 const set=v=>{if(S.sheet){S.sheet.voice=v;refreshDyn()}};
 if(!SR){set('na');return}
 try{const r=new SR();r.lang=LANGS[S.lang].loc;r.maxAlternatives=5;r.interimResults=false;
  let got=false;
  r.onresult=ev=>{got=true;let amt=0;
   for(const alt of Array.from(ev.results[0])){amt=parseAmount(alt.transcript);if(amt)break}
   if(amt&&S.sheet){S.sheet.amount=String(amt);const i=$('#amt');if(i)i.value=S.sheet.amount;set('')}else set('retry')};
  r.onerror=ev=>{const e=ev.error;set(e==='not-allowed'||e==='service-not-allowed'||e==='audio-capture'?'perm':e==='no-speech'||e==='aborted'?'retry':'na')};
  r.onend=()=>{if(S.sheet&&S.sheet.voice==='listening')set(got?'':'retry')};
  set('listening');r.start();
 }catch(e){set('na')}
}
function act(a,v,el,ev){
 switch(a){
    case 'lang':S.lang=v;render();api('/settings',{method:'PUT',body:{...(S.api?.s||{}),language:v}}).catch(()=>{});break;
  case 'go':S.screen=+v;S.sheet=null;render();break;
  case 'openAdd':S.sheet={type:'add',kind:v,amount:'',cat:'cat_cng',voice:''};render();setTimeout(()=>{const i=$('#amt');if(i)i.focus()},50);break;
  case 'openOut':S.sheet={type:'out',amount:'',reason:'r_puncture'};render();setTimeout(()=>{const i=$('#amt');if(i)i.focus()},50);break;
  case 'openBill':S.sheet={type:'bill',id:null,kind:'b_rent',amount:'',day:''};render();setTimeout(()=>{const i=$('#amt');if(i)i.focus()},50);break;
  case 'editBill':{const b=S.bills.find(x=>x.id===+v);if(!b)break;S.sheet={type:'bill',id:b.id,kind:b.kind,amount:String(b.amt),day:String(b.day)};render();break}
  case 'billKind':S.sheet.kind=v;document.querySelectorAll('[data-a="billKind"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));break;
  case 'billDay':S.sheet.day=String(v);{const i=$('#day');if(i)i.value=v}document.querySelectorAll('[data-a="billDay"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===String(v)));refreshDyn();break;
    case 'saveBill':{const sh=S.sheet,amt=num(sh.amount),day=num(sh.day);if(amt<=0||day<1||day>31)break;
   const body={name:sh.kind,amount:amt,dueDate:nextDate(day),repeat:'monthly',mustPay:true};
   S.lab.res={};S.sheet=null;toast(t('bill_saved'));
   (sh.id?api('/bills/'+sh.id,{method:'PATCH',body}):api('/bills',{method:'POST',body})).then(refresh).catch(e=>toast(e.message));break}
    case 'payBill':{const id=S.sheet.id;S.lab.res={};S.sheet=null;toast(t('bill_paid'));api('/bills/'+id+'/pay',{method:'POST'}).then(refresh).catch(e=>toast(e.message));break}
   case 'removeBill':{const id=S.sheet.id;S.lab.res={};S.sheet=null;toast(t('bill_removed'));api('/bills/'+id,{method:'DELETE'}).then(refresh).catch(e=>toast(e.message));break}
  case 'openExport':S.sheet={type:'export'};render();break;
  case 'openReset':S.sheet={type:'reset'};render();break;
  case 'confirmReset':S.sheet=null;api('/seed/clear',{method:'POST'}).then(()=>{S.entries=[];Object.assign(S.lab,{pick:'normal',phase:'idle',res:{},done:{},p:1,fresh:false,details:false,newBadge:false});S.screen=1;toast(t('reset_done'));return refresh()}).catch(e=>toast(e.message));break;
  case 'close':S.sheet=null;render();break;
  case 'scrim':if(ev.target===el){S.sheet=null;render()}break;
  case 'quick':S.sheet.amount=String(v);{const i=$('#amt');if(i)i.value=v}refreshDyn();break;
  case 'cat':S.sheet.cat=v;document.querySelectorAll('[data-a="cat"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));break;
  case 'reason':S.sheet.reason=v;document.querySelectorAll('[data-a="reason"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));break;
  case 'voice':voice();break;
  case 'saveAdd':{const sh=S.sheet,amt=num(sh.amount);if(amt<=0)break;
   const isIn=sh.kind==='fare';
   S.entries.push({id:S.nextId++,kind:isIn?'fare':(sh.cat==='cat_home'?'house':'work'),cat:isIn?'cat_fare':sh.cat,amt});
      S.sheet=null;toast(t('saved'));sync();break}
    case 'confirmOut':{const sh=S.sheet,amt=num(sh.amount),c=calc();if(amt<=0||amt>c.vault)break;
   S.entries.push({id:S.nextId++,kind:'emergency',cat:sh.reason,amt});S.sheet=null;toast(t('out_done'));
   api('/buffer/withdraw',{method:'POST',body:{amount:amt,reason:sh.reason}}).then(()=>api('/buffer/rebuild/accept',{method:'POST'})).then(refresh).catch(e=>toast(e.message));break}
    case 'remove':S.entries=S.entries.filter(e=>e.id!==+v);toast(t('removed'));sync();break;
  case 'why':S.why=!S.why;render();break;
  case 'assume':S.assume=!S.assume;render();break;
  case 'refill':S.refill=!S.refill;render();break;
  case 'pickSc':if(S.lab.phase!=='run'){S.lab.pick=v;S.lab.fresh=false;S.lab.p=1;render()}break;
  case 'runTest':runTest();break;
  case 'nextTest':{const nx=ORDER.find(k=>!S.lab.done[k]);if(nx&&S.lab.phase!=='run'){S.lab.pick=nx;runTest()}break}
  case 'labDetails':S.lab.details=!S.lab.details;render();break;
  case 'copy':{
   const txt=summaryText();
   const legacy=()=>{try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;opacity:0;top:0;left:0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(t(ok?'copied':'copy_fail'))}catch(e){toast(t('copy_fail'))}};
   try{if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(()=>toast(t('copied')),legacy);else legacy()}catch(e){legacy()}
   break}
 }
}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(el)act(el.dataset.a,el.dataset.v,el,ev)});
document.addEventListener('input',ev=>{
 if(ev.target.id==='amt'&&S.sheet){const v=ev.target.value.replace(/\D/g,'').slice(0,6);ev.target.value=v;S.sheet.amount=v;refreshDyn()}
 if(ev.target.id==='day'&&S.sheet){const v=ev.target.value.replace(/\D/g,'').slice(0,2);ev.target.value=v;S.sheet.day=v;refreshDyn()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.sheet){S.sheet=null;render()}});
render();boot();
</script>
